name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

      - name: Create .vercel/project.json
        run: |
          mkdir -p .vercel
          echo '{"projectId":"${{ secrets.VERCEL_PROJECT_ID }}","orgId":"${{ secrets.VERCEL_ORG_ID }}"}' > .vercel/project.json

      - name: Set Vercel env vars
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' | npx vercel@latest env add GOOGLE_SERVICE_ACCOUNT_KEY production --token ${{ secrets.VERCEL_TOKEN }} --yes 2>/dev/null || true
          echo '${{ secrets.GOOGLE_SHEET_ID }}' | npx vercel@latest env add GOOGLE_SHEET_ID production --token ${{ secrets.VERCEL_TOKEN }} --yes 2>/dev/null || true
          echo '${{ secrets.GMAIL_USER }}' | npx vercel@latest env add GMAIL_USER production --token ${{ secrets.VERCEL_TOKEN }} --yes 2>/dev/null || true
          echo '${{ secrets.GMAIL_APP_PASSWORD }}' | npx vercel@latest env add GMAIL_APP_PASSWORD production --token ${{ secrets.VERCEL_TOKEN }} --yes 2>/dev/null || true
          echo '${{ secrets.ADMIN_EMAIL }}' | npx vercel@latest env add ADMIN_EMAIL production --token ${{ secrets.VERCEL_TOKEN }} --yes 2>/dev/null || true

      - name: Deploy to Vercel
        run: npx vercel@latest --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
